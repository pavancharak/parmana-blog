<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap bar">
      <a class="site-title" href="{{ '/' | relative_url }}">Parmana Blog</a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}">Latest</a>
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
        <a href="{{ '/search/' | relative_url }}">Search</a>
        <a href="https://parmanasystems.com">Parmana home</a>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {{ content }}
  </main>
  <aside class="subscribe" aria-labelledby="subscribe-title">
    <div class="wrap">
      <h2 id="subscribe-title">Get new posts</h2>
      <p>New posts appear in your feed reader as soon as they are published.</p>
      <a class="button" href="{{ '/feed.xml' | relative_url }}">Subscribe by RSS</a>
    </div>
  </aside>
  <footer class="site-footer">
    <div class="wrap">
      <p>Written by {{ site.author }}. <a href="https://parmanasystems.com">Parmana</a> &middot; <a href="https://docs.parmanasystems.com">Docs</a> &middot; <a href="https://cal.com/pavan-charak/">Book a meeting</a></p>
    </div>
  </footer>
</body>
</html>
